<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="title desc" data-palette="e66556-e7b96a-f6acc0-51144c69107b">
<title id="title">How Loadbearing reaches a verdict</title>
<desc id="desc">Five stages from a clean baseline to a per-cluster badge, then the six-cluster fixture outcome.</desc>
<style>
text { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }


.anim { animation-duration: 7s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
.drift { animation-name: drift; }
.drift2 { animation-name: drift2; }
.dash { animation: dash 3.2s linear infinite; }
.fade { animation: fade 1s ease-out both; }
.stage { animation: stage 7s ease-in-out infinite; }
.beam-cut { animation: cut 5.5s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) {
  .anim, .dash, .fade, .stage, .beam-cut { animation: none !important; }
}
@keyframes drift { 0%,100% { transform: translate(0,0); opacity:.35 } 50% { transform: translate(7px,-13px); opacity:.95 } }
@keyframes drift2 { 0%,100% { transform: translate(0,0); opacity:.25 } 50% { transform: translate(-6px,-9px); opacity:.8 } }
@keyframes dash { to { stroke-dashoffset: -96; } }
@keyframes fade { from { opacity:0; transform: translateY(8px) } to { opacity:1; transform: translateY(0) } }
@keyframes stage { 0%,100% { opacity:.62 } 18%,42% { opacity:1 } }
@keyframes cut { 0%,100% { opacity:.28 } 50% { opacity:.9 } }

</style>
<defs>
  <radialGradient id="procl-glow" cx="50%" cy="42%" r="58%">
    <stop offset="0" stop-color="#b85145" stop-opacity="0.1"/>
    <stop offset="0.55" stop-color="#886d3f" stop-opacity="0.04"/>
    <stop offset="1" stop-color="#fefaf9" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="procl-beam" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b85145"/>
    <stop offset="1" stop-color="#886d3f"/>
  </linearGradient>
  <linearGradient id="procl-fade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#b85145" stop-opacity="0.9"/>
    <stop offset="1" stop-color="#b85145" stop-opacity="0.15"/>
  </linearGradient>
  <pattern id="procl-grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#f7d0cb" stroke-width="1" opacity="0.7"/>
  </pattern>
  <pattern id="procl-dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="1.4" cy="1.4" r="1.1" fill="#72616b" opacity="0.28"/>
  </pattern>
  <marker id="procl-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0L10 5L0 10z" fill="#b85145"/>
  </marker>
</defs><rect width="1200" height="560" fill="#fefaf9"/><rect width="1200" height="560" fill="url(#procl-grid)" opacity="0.7"/><rect width="1200" height="560" fill="url(#procl-glow)"/><g transform="translate(56 34) scale(1.000)" fill="none" stroke="#b85145" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6.1 15h11.8"/><path d="M14 3v7.342a6 6 0 0 1 1.318 10.658h-6.635a6 6 0 0 1 1.317 -10.66v-7.34h4"/><path d="M9 3h6"/></g><text x="90" y="56" font-size="30" font-weight="700" fill="#27181c">From diff to badge</text><text x="56" y="94" font-size="15.5" fill="#72616b">A red baseline never produces a badge. Only a reversible cluster with green mapped probes does.</text><g class="anim stage" style="animation-delay:0.0s"><rect x="44" y="128" width="212" height="158" rx="10" fill="#fef7f7" stroke="#f7d0cb"/><circle cx="70" cy="158" r="13" fill="#fefaf9" stroke="#b85145"/><text x="70" y="162.5" class="mono" font-size="10.5" text-anchor="middle" fill="#b85145">01</text><text x="92" y="164" font-size="17" font-weight="600" fill="#27181c">Baseline</text><text x="62" y="200" font-size="12.5" fill="#72616b">Run every probe once</text><text x="62" y="220" font-size="12.5" fill="#72616b">on pristine HEAD.</text><text x="62" y="240" font-size="12.5" fill="#72616b">One failure stops the run.</text></g><path d="M257 270H270" stroke="#b85145" stroke-width="1.3" marker-end="url(#procl-arrow)"/><g class="anim stage" style="animation-delay:1.1s"><rect x="271" y="128" width="212" height="158" rx="10" fill="#fef7f7" stroke="#f7d0cb"/><circle cx="297" cy="158" r="13" fill="#fefaf9" stroke="#b85145"/><text x="297" y="162.5" class="mono" font-size="10.5" text-anchor="middle" fill="#b85145">02</text><text x="319" y="164" font-size="17" font-weight="600" fill="#27181c">Fork</text><text x="289" y="200" font-size="12.5" fill="#72616b">git worktree add</text><text x="289" y="220" font-size="12.5" fill="#72616b">--detach HEAD</text><text x="289" y="240" font-size="12.5" fill="#72616b">A fresh temp tree.</text></g><path d="M484 270H497" stroke="#b85145" stroke-width="1.3" marker-end="url(#procl-arrow)"/><g class="anim stage" style="animation-delay:2.2s"><rect x="498" y="128" width="212" height="158" rx="10" fill="#fef7f7" stroke="#f7d0cb"/><circle cx="524" cy="158" r="13" fill="#fefaf9" stroke="#b85145"/><text x="524" y="162.5" class="mono" font-size="10.5" text-anchor="middle" fill="#b85145">03</text><text x="546" y="164" font-size="17" font-weight="600" fill="#27181c">Revert</text><text x="516" y="200" font-size="12.5" fill="#72616b">git apply -R the</text><text x="516" y="220" font-size="12.5" fill="#72616b">cluster's blocks.</text><text x="516" y="240" font-size="12.5" fill="#72616b">Atomic: no partial land.</text></g><path d="M711 270H724" stroke="#b85145" stroke-width="1.3" marker-end="url(#procl-arrow)"/><g class="anim stage" style="animation-delay:3.3s"><rect x="725" y="128" width="212" height="158" rx="10" fill="#fef7f7" stroke="#f7d0cb"/><circle cx="751" cy="158" r="13" fill="#fefaf9" stroke="#b85145"/><text x="751" y="162.5" class="mono" font-size="10.5" text-anchor="middle" fill="#b85145">04</text><text x="773" y="164" font-size="17" font-weight="600" fill="#27181c">Observe</text><text x="743" y="200" font-size="12.5" fill="#72616b">Only probes whose globs</text><text x="743" y="220" font-size="12.5" fill="#72616b">match the cluster run.</text><text x="743" y="240" font-size="12.5" fill="#72616b">No probe, no badge.</text></g><path d="M938 270H951" stroke="#b85145" stroke-width="1.3" marker-end="url(#procl-arrow)"/><g class="anim stage" style="animation-delay:4.4s"><rect x="952" y="128" width="212" height="158" rx="10" fill="#fef7f7" stroke="#f7d0cb"/><circle cx="978" cy="158" r="13" fill="#fefaf9" stroke="#b85145"/><text x="978" y="162.5" class="mono" font-size="10.5" text-anchor="middle" fill="#b85145">05</text><text x="1000" y="164" font-size="17" font-weight="600" fill="#27181c">Badge</text><text x="970" y="200" font-size="12.5" fill="#72616b">Compare exit codes</text><text x="970" y="220" font-size="12.5" fill="#72616b">with the baseline.</text><text x="970" y="240" font-size="12.5" fill="#72616b">Necessary / droppable /</text><text x="970" y="260" font-size="12.5" fill="#72616b">unverifiable.</text></g><text x="44" y="332" class="mono" font-size="11" letter-spacing="1.6" fill="#72616b">THE BUNDLED FIXTURE · 6 CLUSTERS · 3 NECESSARY · 2 DROPPABLE · 1 UNVERIFIABLE</text><rect x="60" y="352" width="168" height="96" rx="9" fill="#fef7f7" stroke="#f7d0cb"/><rect x="60" y="352" width="168" height="3" rx="1.5" fill="#b03a2e"/><text x="74" y="382" class="mono" font-size="11.5" fill="#27181c">src/app.js#1</text><rect x="74" y="396" width="76" height="22" rx="11" fill="#fbeae7" stroke="#b03a2e" stroke-width="0.8"/><text x="112" y="411" class="mono" font-size="10.5" text-anchor="middle" fill="#b03a2e">droppable</text><text x="74" y="436" class="mono" font-size="10.5" fill="#72616b">app 0 → 0</text><rect x="242" y="352" width="168" height="96" rx="9" fill="#fef7f7" stroke="#f7d0cb"/><rect x="242" y="352" width="168" height="3" rx="1.5" fill="#1f7a4d"/><text x="256" y="382" class="mono" font-size="11.5" fill="#27181c">src/app.js#2</text><rect x="256" y="396" width="76" height="22" rx="11" fill="#eaf6ee" stroke="#1f7a4d" stroke-width="0.8"/><text x="294" y="411" class="mono" font-size="10.5" text-anchor="middle" fill="#1f7a4d">necessary</text><text x="256" y="436" class="mono" font-size="10.5" fill="#72616b">app 0 → 1</text><rect x="424" y="352" width="168" height="96" rx="9" fill="#fef7f7" stroke="#f7d0cb"/><rect x="424" y="352" width="168" height="3" rx="1.5" fill="#857a80"/><text x="438" y="382" class="mono" font-size="11.5" fill="#27181c">src/extra.js#1</text><rect x="438" y="396" width="96" height="22" rx="11" fill="#f1edef" stroke="#857a80" stroke-width="0.8"/><text x="486" y="411" class="mono" font-size="10.5" text-anchor="middle" fill="#857a80">unverifiable</text><text x="438" y="436" class="mono" font-size="10.5" fill="#72616b">no probe</text><rect x="606" y="352" width="168" height="96" rx="9" fill="#fef7f7" stroke="#f7d0cb"/><rect x="606" y="352" width="168" height="3" rx="1.5" fill="#1f7a4d"/><text x="620" y="382" class="mono" font-size="11.5" fill="#27181c">src/util.js#1</text><rect x="620" y="396" width="76" height="22" rx="11" fill="#eaf6ee" stroke="#1f7a4d" stroke-width="0.8"/><text x="658" y="411" class="mono" font-size="10.5" text-anchor="middle" fill="#1f7a4d">necessary</text><text x="620" y="436" class="mono" font-size="10.5" fill="#72616b">core 0 → 1</text><rect x="788" y="352" width="168" height="96" rx="9" fill="#fef7f7" stroke="#f7d0cb"/><rect x="788" y="352" width="168" height="3" rx="1.5" fill="#1f7a4d"/><text x="802" y="382" class="mono" font-size="11.5" fill="#27181c">src/util.js#2</text><rect x="802" y="396" width="76" height="22" rx="11" fill="#eaf6ee" stroke="#1f7a4d" stroke-width="0.8"/><text x="840" y="411" class="mono" font-size="10.5" text-anchor="middle" fill="#1f7a4d">necessary</text><text x="802" y="436" class="mono" font-size="10.5" fill="#72616b">core 0 → 1</text><rect x="970" y="352" width="168" height="96" rx="9" fill="#fef7f7" stroke="#f7d0cb"/><rect x="970" y="352" width="168" height="3" rx="1.5" fill="#b03a2e"/><text x="984" y="382" class="mono" font-size="11.5" fill="#27181c">src/util.js#3</text><rect x="984" y="396" width="76" height="22" rx="11" fill="#fbeae7" stroke="#b03a2e" stroke-width="0.8"/><text x="1022" y="411" class="mono" font-size="10.5" text-anchor="middle" fill="#b03a2e">droppable</text><text x="984" y="436" class="mono" font-size="10.5" fill="#72616b">core 0 → 0</text><text x="56" y="502" font-size="13.5" fill="#72616b">Run on the fixture at HEAD~1: <tspan fill="#27181c">6 clusters · 3 necessary · 2 droppable · 1 unverifiable</tspan> — the exact counts the tests assert.</text><text x="56" y="530" class="mono" font-size="11.5" fill="#72616b">exit 0 report · 1 config · 2 precondition · 3 baseline failed</text></svg>
