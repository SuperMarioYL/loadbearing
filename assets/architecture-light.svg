<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="title desc" data-palette="e66556-e7b96a-f6acc0-51144c69107b">
<title id="title">Loadbearing architecture</title>
<desc id="desc">Seven modules in one Node process: cli, diff, cluster, sandbox, probes, verdict, report, driven by the CLI or the MCP tool.</desc>
<style>
text { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }


.anim { animation-duration: 7s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
.drift { animation-name: drift; }
.drift2 { animation-name: drift2; }
.dash { animation: dash 3.2s linear infinite; }
.fade { animation: fade 1s ease-out both; }
.stage { animation: stage 7s ease-in-out infinite; }
.beam-cut { animation: cut 5.5s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) {
  .anim, .dash, .fade, .stage, .beam-cut { animation: none !important; }
}
@keyframes drift { 0%,100% { transform: translate(0,0); opacity:.35 } 50% { transform: translate(7px,-13px); opacity:.95 } }
@keyframes drift2 { 0%,100% { transform: translate(0,0); opacity:.25 } 50% { transform: translate(-6px,-9px); opacity:.8 } }
@keyframes dash { to { stroke-dashoffset: -96; } }
@keyframes fade { from { opacity:0; transform: translateY(8px) } to { opacity:1; transform: translateY(0) } }
@keyframes stage { 0%,100% { opacity:.62 } 18%,42% { opacity:1 } }
@keyframes cut { 0%,100% { opacity:.28 } 50% { opacity:.9 } }

</style>
<defs>
  <radialGradient id="archl-glow" cx="50%" cy="42%" r="58%">
    <stop offset="0" stop-color="#b85145" stop-opacity="0.1"/>
    <stop offset="0.55" stop-color="#886d3f" stop-opacity="0.04"/>
    <stop offset="1" stop-color="#fefaf9" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="archl-beam" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b85145"/>
    <stop offset="1" stop-color="#886d3f"/>
  </linearGradient>
  <linearGradient id="archl-fade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#b85145" stop-opacity="0.9"/>
    <stop offset="1" stop-color="#b85145" stop-opacity="0.15"/>
  </linearGradient>
  <pattern id="archl-grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#f7d0cb" stroke-width="1" opacity="0.7"/>
  </pattern>
  <pattern id="archl-dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="1.4" cy="1.4" r="1.1" fill="#72616b" opacity="0.28"/>
  </pattern>
  <marker id="archl-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0L10 5L0 10z" fill="#b85145"/>
  </marker>
</defs><rect width="1200" height="560" fill="#fefaf9"/><rect width="1200" height="560" fill="url(#archl-grid)" opacity="0.7"/><rect width="1200" height="560" fill="url(#archl-glow)"/><g transform="translate(56 36) scale(1.000)" fill="none" stroke="#b85145" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 18a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/><path d="M5 6a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/><path d="M15 6a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/><path d="M7 8l0 8"/><path d="M9 18h6a2 2 0 0 0 2 -2v-5"/><path d="M14 14l3 -3l3 3"/></g><text x="90" y="58" font-size="30" font-weight="700" fill="#27181c">One process, no server, no model</text><text x="56" y="96" font-size="15.5" fill="#72616b">The CLI and the MCP tool drive the same pipeline. Every probe runs inside a throwaway worktree.</text><rect x="56" y="126" width="250" height="42" rx="10" fill="#fef7f7" stroke="#f7d0cb"/><text x="70" y="152" class="mono" font-size="12.5" fill="#b85145">loadbearing check --base</text><text x="330" y="152" font-size="12" fill="#72616b">CLI</text><rect x="392" y="126" width="300" height="42" rx="10" fill="#fef7f7" stroke="#f7d0cb"/><text x="406" y="152" class="mono" font-size="12.5" fill="#b85145">loadbearing_check (MCP)</text><text x="708" y="152" font-size="12" fill="#72616b">stdio</text><path d="M181 168V196" stroke="#b85145" stroke-width="1.4" marker-end="url(#archl-arrow)" class="dash" stroke-dasharray="4 5"/><path d="M542 168V196" stroke="#b85145" stroke-width="1.4" marker-end="url(#archl-arrow)" class="dash" stroke-dasharray="4 5"/><g class="anim fade" style="animation-delay:0.00s"><rect x="44" y="206" width="146" height="104" rx="10" fill="#fef7f7" stroke="#f7d0cb"/><rect x="44" y="206" width="146" height="3" rx="1.5" fill="#b85145" opacity="0.85"/><text x="56" y="236" class="mono" font-size="14.5" fill="#b85145">cli.ts</text><text x="56" y="262" font-size="11.5" fill="#72616b">flags · exit codes</text></g><path d="M192 258.0H203" stroke="#b85145" stroke-width="1.3" marker-end="url(#archl-arrow)" class="dash" stroke-dasharray="3 4"/><g class="anim fade" style="animation-delay:0.16s"><rect x="204" y="206" width="146" height="104" rx="10" fill="#fef7f7" stroke="#f7d0cb"/><rect x="204" y="206" width="146" height="3" rx="1.5" fill="#b85145" opacity="0.85"/><text x="216" y="236" class="mono" font-size="14.5" fill="#b85145">diff.ts</text><text x="216" y="262" font-size="11.5" fill="#72616b">quotePath=false</text><text x="216" y="280" font-size="11.5" fill="#72616b">hunks · ids</text></g><path d="M352 258.0H363" stroke="#b85145" stroke-width="1.3" marker-end="url(#archl-arrow)" class="dash" stroke-dasharray="3 4"/><g class="anim fade" style="animation-delay:0.32s"><rect x="364" y="206" width="146" height="104" rx="10" fill="#fef7f7" stroke="#f7d0cb"/><rect x="364" y="206" width="146" height="3" rx="1.5" fill="#b85145" opacity="0.85"/><text x="376" y="236" class="mono" font-size="14.5" fill="#b85145">cluster.ts</text><text x="376" y="262" font-size="11.5" fill="#72616b">one hunk,</text><text x="376" y="280" font-size="11.5" fill="#72616b">one unit</text></g><path d="M512 258.0H523" stroke="#b85145" stroke-width="1.3" marker-end="url(#archl-arrow)" class="dash" stroke-dasharray="3 4"/><g class="anim fade" style="animation-delay:0.48s"><rect x="524" y="206" width="146" height="104" rx="10" fill="#fef7f7" stroke="#f7d0cb"/><rect x="524" y="206" width="146" height="3" rx="1.5" fill="#b85145" opacity="0.85"/><text x="536" y="236" class="mono" font-size="14.5" fill="#b85145">sandbox.ts</text><text x="536" y="262" font-size="11.5" fill="#72616b">worktree · git apply -R</text></g><path d="M672 258.0H683" stroke="#b85145" stroke-width="1.3" marker-end="url(#archl-arrow)" class="dash" stroke-dasharray="3 4"/><g class="anim fade" style="animation-delay:0.64s"><rect x="684" y="206" width="146" height="104" rx="10" fill="#fef7f7" stroke="#f7d0cb"/><rect x="684" y="206" width="146" height="3" rx="1.5" fill="#b85145" opacity="0.85"/><text x="696" y="236" class="mono" font-size="14.5" fill="#b85145">probes.ts</text><text x="696" y="262" font-size="11.5" fill="#72616b">globs · timeout</text><text x="696" y="280" font-size="11.5" fill="#72616b">shell oracles</text></g><path d="M832 258.0H843" stroke="#b85145" stroke-width="1.3" marker-end="url(#archl-arrow)" class="dash" stroke-dasharray="3 4"/><g class="anim fade" style="animation-delay:0.80s"><rect x="844" y="206" width="146" height="104" rx="10" fill="#fef7f7" stroke="#f7d0cb"/><rect x="844" y="206" width="146" height="3" rx="1.5" fill="#b85145" opacity="0.85"/><text x="856" y="236" class="mono" font-size="14.5" fill="#b85145">verdict.ts</text><text x="856" y="262" font-size="11.5" fill="#72616b">baseline</text><text x="856" y="280" font-size="11.5" fill="#72616b">compare</text></g><path d="M992 258.0H1003" stroke="#b85145" stroke-width="1.3" marker-end="url(#archl-arrow)" class="dash" stroke-dasharray="3 4"/><g class="anim fade" style="animation-delay:0.96s"><rect x="1004" y="206" width="146" height="104" rx="10" fill="#fef7f7" stroke="#f7d0cb"/><rect x="1004" y="206" width="146" height="3" rx="1.5" fill="#b85145" opacity="0.85"/><text x="1016" y="236" class="mono" font-size="14.5" fill="#b85145">report.ts</text><text x="1016" y="262" font-size="11.5" fill="#72616b">table · report@1</text></g><path d="M712 310V342" stroke="#f7d0cb" stroke-width="1.2" stroke-dasharray="4 5"/><text x="44" y="356" class="mono" font-size="11" letter-spacing="1.6" fill="#72616b">THREE WAYS OUT</text><rect x="44" y="374" width="352" height="118" rx="10" fill="#fef7f7" stroke="#f7d0cb"/><circle cx="64" cy="396" r="4" fill="#b03a2e"/><text x="78" y="401" class="mono" font-size="12.5" fill="#27181c">terminal</text><text x="64" y="424" class="mono" font-size="11" fill="#72616b">cluster-1  droppable</text><text x="64" y="443" class="mono" font-size="11" fill="#72616b">cluster-2  necessary</text><text x="64" y="462" class="mono" font-size="11" fill="#72616b">one row per cluster</text><rect x="418" y="374" width="352" height="118" rx="10" fill="#fef7f7" stroke="#f7d0cb"/><circle cx="438" cy="396" r="4" fill="#b85145"/><text x="452" y="401" class="mono" font-size="12.5" fill="#27181c">loadbearing/report@1</text><text x="438" y="424" class="mono" font-size="11" fill="#72616b">--json for CI gates</text><text x="438" y="443" class="mono" font-size="11" fill="#72616b">scope: mapped-probes-only</text><rect x="792" y="374" width="352" height="118" rx="10" fill="#fef7f7" stroke="#f7d0cb"/><circle cx="812" cy="396" r="4" fill="#886d3f"/><text x="826" y="401" class="mono" font-size="12.5" fill="#27181c">MCP CallToolResult</text><text x="812" y="424" class="mono" font-size="11" fill="#72616b">content[0].text</text><text x="812" y="443" class="mono" font-size="11" fill="#72616b">structuredContent</text><text x="56" y="536" font-size="12.5" fill="#72616b">The user branch is never edited. Worktrees are removed after each cluster, including on failure.</text></svg>
