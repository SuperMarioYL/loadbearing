"330" width="320" height="270" rx="14" fill="#fef7f7" stroke="#f7d0cb"/><rect x="1230" y="330" width="320" height="3" rx="1.5" fill="#b85145" opacity="0.85"/><text x="1254" y="366" class="mono" font-size="10" letter-spacing="1.4" fill="#72616b">REPORT</text><text x="1254" y="394" class="mono" font-size="12.5" fill="#b85145">loadbearing/report@1</text><path d="M1254 408H1526" stroke="#f7d0cb" stroke-width="1"/><text x="1254" y="436" class="mono" font-size="10.5" fill="#72616b">necessary</text><text x="1526" y="436" class="mono" font-size="11.5" font-weight="600" text-anchor="end" fill="#1f7a4d">3</text><text x="1254" y="462" class="mono" font-size="10.5" fill="#72616b">droppable</text><text x="1526" y="462" class="mono" font-size="11.5" font-weight="600" text-anchor="end" fill="#b03a2e">2</text><text x="1254" y="488" class="mono" font-size="10.5" fill="#72616b">unverifiable</text><text x="1526" y="488" class="mono" font-size="11.5" font-weight="600" text-anchor="end" fill="#857a80">1</text><path d="M1254 514H1526" stroke="#f7d0cb" stroke-width="1"/><text x="1254" y="540" font-size="11" fill="#27181c">scope: mapped-probes-only</text><text x="1254" y="562" class="mono" font-size="9.5" fill="#72616b">6 clusters · fixture run</text><text x="1254" y="582" font-size="9.5" fill="#72616b">a droppable badge is not dead code</text><path d="M1194 362H1222" stroke="#b85145" stroke-width="1.6" marker-end="url(#scenel-arrow)" fill="none"/><path d="M1194 548C1210 548 1212 500 1222 448" stroke="#b85145" stroke-width="1.6" marker-end="url(#scenel-arrow)" fill="none"/><text x="70" y="812" font-size="12" fill="#72616b">Illustrative particle graph. Exact counts and recorded output are in the demo below.</text><text x="1530" y="812" class="mono" font-size="11" text-anchor="end" fill="#72616b">loadbearing 0.1.0</text></svg>
