<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-labelledby="scenel-title scenel-desc" data-palette="e66556-e7b96a-f6acc0-51144c69107b">
<title id="scenel-title">Loadbearing scene: a diff converges into per-cluster badges and one report</title>
<desc id="scenel-desc">Illustrative still: a six-hunk diff is split into one-hunk clusters, each cluster is reverted in its own detached worktree with git apply -R, only the probes whose globs match its files run, and the baseline and reverted exit codes are compared. The six-cluster fixture ends at three necessary, two droppable and one unverifiable, recorded in loadbearing/report@1 under scope mapped-probes-only. The branch is never edited.</desc><style>
text { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
@media (prefers-reduced-motion: reduce) { .dash, .pulse { animation: none !important; stroke-dashoffset: 0 !important; } }
.dash { stroke-dasharray: 5 8; animation: dash 5.5s linear infinite; }
.pulse { animation: pulse 6s ease-in-out infinite; }
@keyframes dash { to { stroke-dashoffset: -52; } }
@keyframes pulse { 0%,100% { opacity: .45 } 50% { opacity: 1 } }
</style><defs>
<radialGradient id="scenel-glow" cx="50%" cy="46%" r="58%">
  <stop offset="0" stop-color="#b85145" stop-opacity="0.1"/>
  <stop offset="0.55" stop-color="#886d3f" stop-opacity="0.035"/>
  <stop offset="1" stop-color="#fefaf9" stop-opacity="0"/>
</radialGradient>
<pattern id="scenel-grid" width="40" height="40" patternUnits="userSpaceOnUse">
  <path d="M40 0H0V40" fill="none" stroke="#f7d0cb" stroke-width="1" opacity="0.7"/>
</pattern>
<marker id="scenel-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
  <path d="M0 0L10 5L0 10z" fill="#b85145"/>
</marker>
</defs>
<rect width="1600" height="900" fill="#fefaf9"/>
<rect width="1600" height="900" fill="url(#scenel-grid)" opacity="0.6"/>
<rect width="1600" height="900" fill="url(#scenel-glow)"/>
