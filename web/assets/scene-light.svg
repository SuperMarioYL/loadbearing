· HEAD~1...HEAD</text><text x="94" y="378" font-size="24" font-weight="700" fill="#27181c">3 files · 6 hunks</text><text x="94" y="404" font-size="14" fill="#72616b">6 one-hunk clusters</text><path d="M94 422H426" stroke="#f7d0cb" stroke-width="1"/><text x="94" y="452" class="mono" font-size="10.5" fill="#27181c">src/app.js#1</text><text x="272" y="452" class="mono" font-size="10.5" fill="#27181c">src/util.js#1</text><text x="94" y="478" class="mono" font-size="10.5" fill="#27181c">src/app.js#2</text><text x="272" y="478" class="mono" font-size="10.5" fill="#27181c">src/util.js#2</text><text x="94" y="504" class="mono" font-size="10.5" fill="#27181c">src/extra.js#1</text><text x="272" y="504" class="mono" font-size="10.5" fill="#27181c">src/util.js#3</text><text x="94" y="560" font-size="11" fill="#72616b">one hunk, one unit</text><text x="94" y="582" font-size="11" fill="#72616b">a failed apply merges the next hunk</text><circle cx="640" cy="455" r="165" fill="none" stroke="#b85145" stroke-width="1.2" stroke-dasharray="7 10" opacity="0.7" class="dash"/><circle cx="640" cy="455" r="150" fill="none" stroke="#f7d0cb" stroke-width="1" opacity="0.8"/><circle cx="640" cy="455" r="74" fill="url(#scenel-glow)"/><circle cx="640" cy="455" r="44" fill="#b85145" opacity="0.1"/><circle cx="640" cy="455" r="22" fill="#b85145" opacity="0.22"/><circle cx="640" cy="455" r="9" fill="#916571"/><circle cx="640" cy="455" r="9" fill="none" stroke="#b85145" stroke-width="1.1" opacity="0.7" class="pulse"/><line x1="640" y1="455" x2="640.0" y2="290.0" stroke="#b85145" stroke-width="1.1" stroke-opacity="0.4"/><circle cx="640.0" cy="290.0" r="7" fill="#886d3f" opacity="0.9"/><line x1="640" y1="455" x2="782.9" y2="372.5" stroke="#b85145" stroke-width="1.1" stroke-opacity="0.4"/><circle cx="782.9" cy="372.5" r="7" fill="#886d3f" opacity="0.9"/><line x1="640" y1="455" x2="782.9" y2="537.5" stroke="#b85145" stroke-width="1.1" stroke-opacity="0.4"/><circle cx="782.9" cy="537.5" r="7" fill="#886d3