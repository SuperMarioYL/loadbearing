<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="title desc" data-palette="e66556-e7b96a-f6acc0-51144c69107b">
<title id="title">Loadbearing architecture</title>
<desc id="desc">Seven modules in one Node process: cli, diff, cluster, sandbox, probes, verdict, report, driven by the CLI or the MCP tool.</desc>
<style>
text { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }


</style>
<defs>
  <radialGradient id="archds-glow" cx="50%" cy="42%" r="58%">
    <stop offset="0" stop-color="#e66556" stop-opacity="0.24"/>
    <stop offset="0.55" stop-color="#e7b96a" stop-opacity="0.07"/>
    <stop offset="1" stop-color="#0a070d" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="archds-beam" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e66556"/>
    <stop offset="1" stop-color="#e7b96a"/>
  </linearGradient>
  <linearGradient id="archds-fade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#e66556" stop-opacity="0.9"/>
    <stop offset="1" stop-color="#e66556" stop-opacity="0.15"/>
  </linearGradient>
  <pattern id="archds-grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#3a1c1d" stroke-width="1" opacity="0.55"/>
  </pattern>
  <pattern id="archds-dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="1.4" cy="1.4" r="1.1" fill="#b29fa8" opacity="0.28"/>
  </pattern>
  <marker id="archds-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0L10 5L0 10z" fill="#e66556"/>
  </marker>
</defs><rect width="1200" height="560" fill="#0a070d"/><rect width="1200" height="560" fill="url(#archds-grid)" opacity="0.45"/><rect width="1200" height="560" fill="url(#archds-glow)"/><g transform="translate(56 36) scale(1.000)" fill="none" stroke="#e66556" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 18a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/><path d="M5 6a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/><path d="M15 6a2 2 0 1 0 4 0a2 2 0 1 0 -4 0"/><path d="M7 8l0 8"/><path d="M9 18h6a2 2 0 0 0 2 -2v-5"/><path d="M14 14l3 -3l3 3"/></g><text x="90" y="58" font-size="30" font-weight="700" fill="#fdeef2">One process, no server, no model</text><text x="56" y="96" font-size="15.5" fill="#b29fa8">The CLI and the MCP tool drive the same pipeline. Every probe runs inside a throwaway worktree.</text><rect x="56" y="126" width="250" height="42" rx="10" fill="#131017" stroke="#3a1c1d"/><text x="70" y="152" class="mono" font-size="12.5" fill="#e66556">loadbearing check --base</text><text x="330" y="152" font-size="12" fill="#b29fa8">CLI</text><rect x="392" y="126" width="300" height="42" rx="10" fill="#131017" stroke="#3a1c1d"/><text x="406" y="152" class="mono" font-size="12.5" fill="#e66556">loadbearing_check (MCP)</text><text x="708" y="152" font-size="12" fill="#b29fa8">stdio</text><path d="M181 168V196" stroke="#e66556" stroke-width="1.4" marker-end="url(#archds-arrow)" class="" stroke-dasharray="4 5"/><path d="M542 168V196" stroke="#e66556" stroke-width="1.4" marker-end="url(#archds-arrow)" class="" stroke-dasharray="4 5"/><g class=""><rect x="44" y="206" width="146" height="104" rx="10" fill="#131017" stroke="#3a1c1d"/><rect x="44" y="206" width="146" height="3" rx="1.5" fill="#e66556" opacity="0.85"/><text x="56" y="236" class="mono" font-size="14.5" fill="#e66556">cli.ts</text><text x="56" y="262" font-size="11.5" fill="#b29fa8">flags · exit codes</text></g><path d="M192 258.0H203" stroke="#e66556" stroke-width="1.3" marker-end="url(#archds-arrow)" class="" stroke-dasharray="3 4"/><g class=""><rect x="204" y="206" width="146" height="104" rx="10" fill="#131017" stroke="#3a1c1d"/><rect x="204" y="206" width="146" height="3" rx="1.5" fill="#e66556" opacity="0.85"/><text x="216" y="236" class="mono" font-size="14.5" fill="#e66556">diff.ts</text><text x="216" y="262" font-size="11.5" fill="#b29fa8">quotePath=false</text><text x="216" y="280" font-size="11.5" fill="#b29fa8">hunks · ids</text></g><path d="M352 258.0H363" stroke="#e66556" stroke-width="1.3" marker-end="url(#archds-arrow)" class="" stroke-dasharray="3 4"/><g class=""><rect x="364" y="206" width="146" height="104" rx="10" fill="#131017" stroke="#3a1c1d"/><rect x="364" y="206" width="146" height="3" rx="1.5" fill="#e66556" opacity="0.85"/><text x="376" y="236" class="mono" font-size="14.5" fill="#e66556">cluster.ts</text><text x="376" y="262" font-size="11.5" fill="#b29fa8">one hunk,</text><text x="376" y="280" font-size="11.5" fill="#b29fa8">one unit</text></g><path d="M512 258.0H523" stroke="#e66556" stroke-width="1.3" marker-end="url(#archds-arrow)" class="" stroke-dasharray="3 4"/><g class=""><rect x="524" y="206" width="146" height="104" rx="10" fill="#131017" stroke="#3a1c1d"/><rect x="524" y="206" width="146" height="3" rx="1.5" fill="#e66556" opacity="0.85"/><text x="536" y="236" class="mono" font-size="14.5" fill="#e66556">sandbox.ts</text><text x="536" y="262" font-size="11.5" fill="#b29fa8">worktree · git apply -R</text></g><path d="M672 258.0H683" stroke="#e66556" stroke-width="1.3" marker-end="url(#archds-arrow)" class="" stroke-dasharray="3 4"/><g class=""><rect x="684" y="206" width="146" height="104" rx="10" fill="#131017" stroke="#3a1c1d"/><rect x="684" y="206" width="146" height="3" rx="1.5" fill="#e66556" opacity="0.85"/><text x="696" y="236" class="mono" font-size="14.5" fill="#e66556">probes.ts</text><text x="696" y="262" font-size="11.5" fill="#b29fa8">globs · timeout</text><text x="696" y="280" font-size="11.5" fill="#b29fa8">shell oracles</text></g><path d="M832 258.0H843" stroke="#e66556" stroke-width="1.3" marker-end="url(#archds-arrow)" class="" stroke-dasharray="3 4"/><g class=""><rect x="844" y="206" width="146" height="104" rx="10" fill="#131017" stroke="#3a1c1d"/><rect x="844" y="206" width="146" height="3" rx="1.5" fill="#e66556" opacity="0.85"/><text x="856" y="236" class="mono" font-size="14.5" fill="#e66556">verdict.ts</text><text x="856" y="262" font-size="11.5" fill="#b29fa8">baseline</text><text x="856" y="280" font-size="11.5" fill="#b29fa8">compare</text></g><path d="M992 258.0H1003" stroke="#e66556" stroke-width="1.3" marker-end="url(#archds-arrow)" class="" stroke-dasharray="3 4"/><g class=""><rect x="1004" y="206" width="146" height="104" rx="10" fill="#131017" stroke="#3a1c1d"/><rect x="1004" y="206" width="146" height="3" rx="1.5" fill="#e66556" opacity="0.85"/><text x="1016" y="236" class="mono" font-size="14.5" fill="#e66556">report.ts</text><text x="1016" y="262" font-size="11.5" fill="#b29fa8">table · report@1</text></g><path d="M712 310V342" stroke="#3a1c1d" stroke-width="1.2" stroke-dasharray="4 5"/><text x="44" y="356" class="mono" font-size="11" letter-spacing="1.6" fill="#b29fa8">THREE WAYS OUT</text><rect x="44" y="374" width="352" height="118" rx="10" fill="#131017" stroke="#3a1c1d"/><circle cx="64" cy="396" r="4" fill="#ff7a6b"/><text x="78" y="401" class="mono" font-size="12.5" fill="#fdeef2">terminal</text><text x="64" y="424" class="mono" font-size="11" fill="#b29fa8">cluster-1  droppable</text><text x="64" y="443" class="mono" font-size="11" fill="#b29fa8">cluster-2  necessary</text><text x="64" y="462" class="mono" font-size="11" fill="#b29fa8">one row per cluster</text><rect x="418" y="374" width="352" height="118" rx="10" fill="#131017" stroke="#3a1c1d"/><circle cx="438" cy="396" r="4" fill="#e66556"/><text x="452" y="401" class="mono" font-size="12.5" fill="#fdeef2">loadbearing/report@1</text><text x="438" y="424" class="mono" font-size="11" fill="#b29fa8">--json for CI gates</text><text x="438" y="443" class="mono" font-size="11" fill="#b29fa8">scope: mapped-probes-only</text><rect x="792" y="374" width="352" height="118" rx="10" fill="#131017" stroke="#3a1c1d"/><circle cx="812" cy="396" r="4" fill="#e7b96a"/><text x="826" y="401" class="mono" font-size="12.5" fill="#fdeef2">MCP CallToolResult</text><text x="812" y="424" class="mono" font-size="11" fill="#b29fa8">content[0].text</text><text x="812" y="443" class="mono" font-size="11" fill="#b29fa8">structuredContent</text><text x="56" y="536" font-size="12.5" fill="#b29fa8">The user branch is never edited. Worktrees are removed after each cluster, including on failure.</text></svg>
