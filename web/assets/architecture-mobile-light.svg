<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 900" width="520" height="900" role="img" aria-labelledby="archml-title archml-desc" data-palette="e66556-e7b96a-f6acc0-51144c69107b">
<title id="archml-title">Loadbearing architecture (narrow)</title>
<desc id="archml-desc">Seven modules in one Node process — cli, diff, cluster, sandbox, probes, verdict and report — driven by the CLI or the MCP tool, with three outputs: a terminal table, report@1 JSON and an MCP CallToolResult. The user branch is never edited and worktrees are removed after each cluster.</desc><style>
text { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
@media (prefers-reduced-motion: reduce) { .dash, .pulse { animation: none !important; stroke-dashoffset: 0 !important; } }
.dash { stroke-dasharray: 5 8; animation: dash 5.5s linear infinite; }
.pulse { animation: pulse 6s ease-in-out infinite; }
@keyframes dash { to { stroke-dashoffset: -52; } }
@keyframes pulse { 0%,100% { opacity: .45 } 50% { opacity: 1 } }
</style><defs>
<radialGradient id="archml-glow" cx="50%" cy="46%" r="58%">
  <stop offset="0" stop-color="#b85145" stop-opacity="0.1"/>
  <stop offset="0.55" stop-color="#886d3f" stop-opacity="0.035"/>
  <stop offset="1" stop-color="#fefaf9" stop-opacity="0"/>
</radialGradient>
<pattern id="archml-grid" width="40" height="40" patternUnits="userSpaceOnUse">
  <path d="M40 0H0V40" fill="none" stroke="#f7d0cb" stroke-width="1" opacity="0.7"/>
</pattern>
<marker id="archml-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
  <path d="M0 0L10 5L0 10z" fill="#b85145"/>
</marker>
</defs>
<rect width="520" height="900" fill="#fefaf9"/>
<rect width="520" height="900" fill="url(#archml-grid)" opacity="0.6"/>
<rect width="520" height="900" fill="url(#archml-glow)"/>
<text x="32" y="52" font-size="21" font-weight="700" fill="#27181c">Seven modules, one process</text><text x="32" y="76" font-size="10.5" fill="#72616b">The CLI and the MCP tool drive the same pipeline.</text><text x="32" y="93" font-size="10.5" fill="#72616b">Every probe runs inside a throwaway worktree.</text><rect x="32" y="116" width="456" height="32" rx="8" fill="#fef7f7" stroke="#f7d0cb"/><text x="46" y="137" class="mono" font-size="11" fill="#b85145">loadbearing check --base &lt;rev&gt;</text><text x="474" y="137" font-size="9" text-anchor="end" fill="#72616b">CLI</text><rect x="32" y="156" width="456" height="32" rx="8" fill="#fef7f7" stroke="#f7d0cb"/><text x="46" y="177" class="mono" font-size="11" fill="#b85145">loadbearing_check (MCP)</text><text x="474" y="177" font-size="9" text-anchor="end" fill="#72616b">stdio</text><text x="32" y="216" class="mono" font-size="8.5" letter-spacing="1.6" fill="#72616b">SEVEN MODULES · ONE PROCESS</text><rect x="32" y="226" width="456" height="52" rx="8" fill="#fef7f7" stroke="#f7d0cb"/><rect x="32" y="226" width="3.5" height="52" rx="1.75" fill="#b85145" opacity="0.85"/><text x="50" y="248" class="mono" font-size="12" fill="#b85145">cli.ts</text><text x="50" y="266" font-size="9.5" fill="#72616b">flags · exit codes</text><rect x="32" y="286" width="456" height="52" rx="8" fill="#fef7f7" stroke="#f7d0cb"/><rect x="32" y="286" width="3.5" height="52" rx="1.75" fill="#b85145" opacity="0.85"/><text x="50" y="308" class="mono" font-size="12" fill="#b85145">diff.ts</text><text x="50" y="326" font-size="9.5" fill="#72616b">quotePath=false · hunk ids</text><rect x="32" y="346" width="456" height="52" rx="8" fill="#fef7f7" stroke="#f7d0cb"/><rect x="32" y="346" width="3.5" height="52" rx="1.75" fill="#b85145" opacity="0.85"/><text x="50" y="368" class="mono" font-size="12" fill="#b85145">cluster.ts</text><text x="50" y="386" font-size="9.5" fill="#72616b">one hunk · same-file merge</text><rect x="32" y="406" width="456" height="52" rx="8" fill="#fef7f7" stroke="#f7d0cb"/><rect x="32" y="406" width="3.5" height="52" rx="1.75" fill="#b85145" opacity="0.85"/><text x="50" y="428" class="mono" font-size="12" fill="#b85145">sandbox.ts</text><text x="50" y="446" font-size="9.5" fill="#72616b">worktree · git apply -R</text><rect x="32" y="466" width="456" height="52" rx="8" fill="#fef7f7" stroke="#f7d0cb"/><rect x="32" y="466" width="3.5" height="52" rx="1.75" fill="#b85145" opacity="0.85"/><text x="50" y="488" class="mono" font-size="12" fill="#b85145">probes.ts</text><text x="50" y="506" font-size="9.5" fill="#72616b">globs · timeout · shell</text><rect x="32" y="526" width="456" height="52" rx="8" fill="#fef7f7" stroke="#f7d0cb"/><rect x="32" y="526" width="3.5" height="52" rx="1.75" fill="#b85145" opacity="0.85"/><text x="50" y="548" class="mono" font-size="12" fill="#b85145">verdict.ts</text><text x="50" y="566" font-size="9.5" fill="#72616b">baseline compare</text><rect x="32" y="586" width="456" height="52" rx="8" fill="#fef7f7" stroke="#f7d0cb"/><rect x="32" y="586" width="3.5" height="52" rx="1.75" fill="#b85145" opacity="0.85"/><text x="50" y="608" class="mono" font-size="12" fill="#b85145">report.ts</text><text x="50" y="626" font-size="9.5" fill="#72616b">table · report@1</text><text x="32" y="682" class="mono" font-size="8.5" letter-spacing="1.6" fill="#72616b">THREE WAYS OUT</text><rect x="32" y="694" width="456" height="42" rx="8" fill="#fef7f7" stroke="#f7d0cb"/><circle cx="48" cy="715" r="3.4" fill="#b03a2e"/><text x="62" y="711" class="mono" font-size="10.5" fill="#27181c">terminal</text><text x="62" y="726" class="mono" font-size="8.8" fill="#72616b">cluster-1 droppable · cluster-2 necessary</text><rect x="32" y="744" width="456" height="42" rx="8" fill="#fef7f7" stroke="#f7d0cb"/><circle cx="48" cy="765" r="3.4" fill="#b85145"/><text x="62" y="761" class="mono" font-size="10.5" fill="#27181c">loadbearing/report@1</text><text x="62" y="776" class="mono" font-size="8.8" fill="#72616b">--json for CI gates</text><rect x="32" y="794" width="456" height="42" rx="8" fill="#fef7f7" stroke="#f7d0cb"/><circle cx="48" cy="815" r="3.4" fill="#886d3f"/><text x="62" y="811" class="mono" font-size="10.5" fill="#27181c">MCP CallToolResult</text><text x="62" y="826" class="mono" font-size="8.8" fill="#72616b">content[0].text · structuredContent</text><text x="32" y="858" font-size="9.5" fill="#72616b">The user branch is never edited.</text><text x="32" y="874" font-size="9.5" fill="#72616b">Worktrees are removed after each cluster, including on failure.</text></svg>
