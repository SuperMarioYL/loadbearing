<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="title desc" data-palette="e66556-e7b96a-f6acc0-51144c69107b">
<title id="title">Loadbearing verdict scope</title>
<desc id="desc">A central mapped-probes-only boundary ring with the CLI, MCP, CI and probe globs around it, and an unmapped consumer explicitly outside the claim.</desc>
<style>
text { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }


</style>
<defs>
  <radialGradient id="scopels-glow" cx="50%" cy="42%" r="58%">
    <stop offset="0" stop-color="#b85145" stop-opacity="0.1"/>
    <stop offset="0.55" stop-color="#886d3f" stop-opacity="0.04"/>
    <stop offset="1" stop-color="#fefaf9" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="scopels-beam" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#b85145"/>
    <stop offset="1" stop-color="#886d3f"/>
  </linearGradient>
  <linearGradient id="scopels-fade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#b85145" stop-opacity="0.9"/>
    <stop offset="1" stop-color="#b85145" stop-opacity="0.15"/>
  </linearGradient>
  <pattern id="scopels-grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#f7d0cb" stroke-width="1" opacity="0.7"/>
  </pattern>
  <pattern id="scopels-dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="1.4" cy="1.4" r="1.1" fill="#72616b" opacity="0.28"/>
  </pattern>
  <marker id="scopels-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0L10 5L0 10z" fill="#b85145"/>
  </marker>
</defs><rect width="1200" height="560" fill="#fefaf9"/><rect width="1200" height="560" fill="url(#scopels-grid)" opacity="0.65"/><rect width="1200" height="560" fill="url(#scopels-glow)"/><g transform="translate(56 34) scale(1.000)" fill="none" stroke="#b85145" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 12l5 5l-1.5 1.5a3.536 3.536 0 1 1 -5 -5l1.5 -1.5"/><path d="M17 12l-5 -5l1.5 -1.5a3.536 3.536 0 1 1 5 5l-1.5 1.5"/><path d="M3 21l2.5 -2.5"/><path d="M18.5 5.5l2.5 -2.5"/><path d="M10 11l-2 2"/><path d="M13 14l-2 2"/></g><text x="90" y="56" font-size="30" font-weight="700" fill="#27181c">Bounded on purpose</text><text x="56" y="94" font-size="15.5" fill="#72616b">A droppable badge means no mapped probe regressed. It is not a claim that the code is dead.</text><ellipse cx="600" cy="292" rx="286" ry="152" fill="none" stroke="#b85145" stroke-width="1.3" stroke-dasharray="7 9" opacity="0.75" class=""/><ellipse cx="600" cy="292" rx="270" ry="140" fill="none" stroke="#f7d0cb" stroke-width="1" opacity="0.8"/><rect x="430" y="234" width="340" height="116" rx="14" fill="#fef7f7" stroke="#b85145" stroke-width="1.2"/><text x="600" y="268" text-anchor="middle" class="mono" font-size="13" letter-spacing="1" fill="#b85145">loadbearing/report@1</text><text x="600" y="296" text-anchor="middle" font-size="16" font-weight="600" fill="#27181c">scope: mapped-probes-only</text><text x="600" y="322" text-anchor="middle" font-size="11.5" fill="#72616b">same-file clusters · no symbol tracing</text><rect x="322" y="163" width="132" height="50" rx="10" fill="#fef7f7" stroke="#f7d0cb"/><circle cx="338" cy="188" r="3.5" fill="#b85145"/><text x="350" y="184" class="mono" font-size="11.5" fill="#27181c">CLI check</text><text x="350" y="201" class="mono" font-size="9.8" fill="#72616b">exit 0–3</text><rect x="322" y="359" width="132" height="50" rx="10" fill="#fef7f7" stroke="#f7d0cb"/><circle cx="338" cy="384" r="3.5" fill="#b85145"/><text x="350" y="380" class="mono" font-size="11.5" fill="#27181c">MCP tool</text><text x="350" y="397" class="mono" font-size="9.8" fill="#72616b">loadbearing_check</text><rect x="746" y="163" width="132" height="50" rx="10" fill="#fef7f7" stroke="#f7d0cb"/><circle cx="762" cy="188" r="3.5" fill="#b85145"/><text x="774" y="184" class="mono" font-size="11.5" fill="#27181c">CI gate</text><text x="774" y="201" class="mono" font-size="9.8" fill="#72616b">--json</text><rect x="746" y="359" width="132" height="50" rx="10" fill="#fef7f7" stroke="#f7d0cb"/><circle cx="762" cy="384" r="3.5" fill="#b85145"/><text x="774" y="380" class="mono" font-size="11.5" fill="#27181c">probe globs</text><text x="774" y="397" class="mono" font-size="9.8" fill="#72616b">src/**</text><rect x="540.0" y="93" width="120" height="50" rx="10" fill="#fef7f7" stroke="#f7d0cb"/><circle cx="556.0" cy="118" r="3.5" fill="#b85145"/><text x="568.0" y="114" class="mono" font-size="11.5" fill="#27181c">worktree</text><text x="568.0" y="131" class="mono" font-size="9.8" fill="#72616b">git apply -R</text><rect x="540.0" y="425" width="120" height="50" rx="10" fill="#fef7f7" stroke="#f7d0cb"/><circle cx="556.0" cy="450" r="3.5" fill="#b85145"/><text x="568.0" y="446" class="mono" font-size="11.5" fill="#27181c">baseline</text><text x="568.0" y="463" class="mono" font-size="9.8" fill="#72616b">pristine HEAD</text><rect x="60" y="470" width="470" height="58" rx="10" fill="#fbeae7" stroke="#b03a2e" stroke-dasharray="6 6"/><text x="78" y="494" font-size="12.5" font-weight="600" fill="#b03a2e">Outside the claim</text><text x="78" y="514" font-size="11.5" fill="#72616b">a consumer in another package, or an unprobed external contract</text><text x="800" y="500" font-size="11.5" fill="#72616b">We report what the probes saw, never more.</text><text x="800" y="522" font-size="11.5" fill="#72616b">Cross-file consumers are a stated v0.1 limitation.</text><circle cx="400" cy="142" r="2.0" fill="#886d3f" opacity="0.75" class=""/><circle cx="790" cy="144" r="2.7" fill="#b85145" opacity="0.75" class=""/><circle cx="870" cy="302" r="3.4" fill="#b85145" opacity="0.75" class=""/><circle cx="336" cy="312" r="2.0" fill="#886d3f" opacity="0.75" class=""/><circle cx="540" cy="442" r="2.7" fill="#b85145" opacity="0.75" class=""/><circle cx="670" cy="138" r="3.4" fill="#b85145" opacity="0.75" class=""/></svg>
