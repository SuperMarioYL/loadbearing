<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" role="img" aria-labelledby="title desc" data-palette="e66556-e7b96a-f6acc0-51144c69107b">
<title id="title">Loadbearing verdict scope</title>
<desc id="desc">A central mapped-probes-only boundary ring with the CLI, MCP, CI and probe globs around it, and an unmapped consumer explicitly outside the claim.</desc>
<style>
text { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }


.anim { animation-duration: 7s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
.drift { animation-name: drift; }
.drift2 { animation-name: drift2; }
.dash { animation: dash 3.2s linear infinite; }
.fade { animation: fade 1s ease-out both; }
.stage { animation: stage 7s ease-in-out infinite; }
.beam-cut { animation: cut 5.5s ease-in-out infinite; }
@media (prefers-reduced-motion: reduce) {
  .anim, .dash, .fade, .stage, .beam-cut { animation: none !important; }
}
@keyframes drift { 0%,100% { transform: translate(0,0); opacity:.35 } 50% { transform: translate(7px,-13px); opacity:.95 } }
@keyframes drift2 { 0%,100% { transform: translate(0,0); opacity:.25 } 50% { transform: translate(-6px,-9px); opacity:.8 } }
@keyframes dash { to { stroke-dashoffset: -96; } }
@keyframes fade { from { opacity:0; transform: translateY(8px) } to { opacity:1; transform: translateY(0) } }
@keyframes stage { 0%,100% { opacity:.62 } 18%,42% { opacity:1 } }
@keyframes cut { 0%,100% { opacity:.28 } 50% { opacity:.9 } }

</style>
<defs>
  <radialGradient id="scoped-glow" cx="50%" cy="42%" r="58%">
    <stop offset="0" stop-color="#e66556" stop-opacity="0.24"/>
    <stop offset="0.55" stop-color="#e7b96a" stop-opacity="0.07"/>
    <stop offset="1" stop-color="#0a070d" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="scoped-beam" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#e66556"/>
    <stop offset="1" stop-color="#e7b96a"/>
  </linearGradient>
  <linearGradient id="scoped-fade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#e66556" stop-opacity="0.9"/>
    <stop offset="1" stop-color="#e66556" stop-opacity="0.15"/>
  </linearGradient>
  <pattern id="scoped-grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#3a1c1d" stroke-width="1" opacity="0.55"/>
  </pattern>
  <pattern id="scoped-dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="1.4" cy="1.4" r="1.1" fill="#b29fa8" opacity="0.28"/>
  </pattern>
  <marker id="scoped-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
    <path d="M0 0L10 5L0 10z" fill="#e66556"/>
  </marker>
</defs><rect width="1200" height="560" fill="#0a070d"/><rect width="1200" height="560" fill="url(#scoped-grid)" opacity="0.4"/><rect width="1200" height="560" fill="url(#scoped-glow)"/><g transform="translate(56 34) scale(1.000)" fill="none" stroke="#e66556" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 12l5 5l-1.5 1.5a3.536 3.536 0 1 1 -5 -5l1.5 -1.5"/><path d="M17 12l-5 -5l1.5 -1.5a3.536 3.536 0 1 1 5 5l-1.5 1.5"/><path d="M3 21l2.5 -2.5"/><path d="M18.5 5.5l2.5 -2.5"/><path d="M10 11l-2 2"/><path d="M13 14l-2 2"/></g><text x="90" y="56" font-size="30" font-weight="700" fill="#fdeef2">Bounded on purpose</text><text x="56" y="94" font-size="15.5" fill="#b29fa8">A droppable badge means no mapped probe regressed. It is not a claim that the code is dead.</text><ellipse cx="600" cy="292" rx="286" ry="152" fill="none" stroke="#e66556" stroke-width="1.3" stroke-dasharray="7 9" opacity="0.75" class="dash"/><ellipse cx="600" cy="292" rx="270" ry="140" fill="none" stroke="#3a1c1d" stroke-width="1" opacity="0.8"/><rect x="430" y="234" width="340" height="116" rx="14" fill="#131017" stroke="#e66556" stroke-width="1.2"/><text x="600" y="268" text-anchor="middle" class="mono" font-size="13" letter-spacing="1" fill="#e66556">loadbearing/report@1</text><text x="600" y="296" text-anchor="middle" font-size="16" font-weight="600" fill="#fdeef2">scope: mapped-probes-only</text><text x="600" y="322" text-anchor="middle" font-size="11.5" fill="#b29fa8">same-file clusters · no symbol tracing</text><rect x="322" y="163" width="132" height="50" rx="10" fill="#131017" stroke="#3a1c1d"/><circle cx="338" cy="188" r="3.5" fill="#e66556"/><text x="350" y="184" class="mono" font-size="11.5" fill="#fdeef2">CLI check</text><text x="350" y="201" class="mono" font-size="9.8" fill="#b29fa8">exit 0–3</text><rect x="322" y="359" width="132" height="50" rx="10" fill="#131017" stroke="#3a1c1d"/><circle cx="338" cy="384" r="3.5" fill="#e66556"/><text x="350" y="380" class="mono" font-size="11.5" fill="#fdeef2">MCP tool</text><text x="350" y="397" class="mono" font-size="9.8" fill="#b29fa8">loadbearing_check</text><rect x="746" y="163" width="132" height="50" rx="10" fill="#131017" stroke="#3a1c1d"/><circle cx="762" cy="188" r="3.5" fill="#e66556"/><text x="774" y="184" class="mono" font-size="11.5" fill="#fdeef2">CI gate</text><text x="774" y="201" class="mono" font-size="9.8" fill="#b29fa8">--json</text><rect x="746" y="359" width="132" height="50" rx="10" fill="#131017" stroke="#3a1c1d"/><circle cx="762" cy="384" r="3.5" fill="#e66556"/><text x="774" y="380" class="mono" font-size="11.5" fill="#fdeef2">probe globs</text><text x="774" y="397" class="mono" font-size="9.8" fill="#b29fa8">src/**</text><rect x="540.0" y="93" width="120" height="50" rx="10" fill="#131017" stroke="#3a1c1d"/><circle cx="556.0" cy="118" r="3.5" fill="#e66556"/><text x="568.0" y="114" class="mono" font-size="11.5" fill="#fdeef2">worktree</text><text x="568.0" y="131" class="mono" font-size="9.8" fill="#b29fa8">git apply -R</text><rect x="540.0" y="425" width="120" height="50" rx="10" fill="#131017" stroke="#3a1c1d"/><circle cx="556.0" cy="450" r="3.5" fill="#e66556"/><text x="568.0" y="446" class="mono" font-size="11.5" fill="#fdeef2">baseline</text><text x="568.0" y="463" class="mono" font-size="9.8" fill="#b29fa8">pristine HEAD</text><rect x="60" y="470" width="470" height="58" rx="10" fill="#2a1210" stroke="#ff7a6b" stroke-dasharray="6 6"/><text x="78" y="494" font-size="12.5" font-weight="600" fill="#ff7a6b">Outside the claim</text><text x="78" y="514" font-size="11.5" fill="#b29fa8">a consumer in another package, or an unprobed external contract</text><text x="800" y="500" font-size="11.5" fill="#b29fa8">We report what the probes saw, never more.</text><text x="800" y="522" font-size="11.5" fill="#b29fa8">Cross-file consumers are a stated v0.1 limitation.</text><circle cx="400" cy="142" r="2.0" fill="#e7b96a" opacity="0.75" class="anim drift"/><circle cx="790" cy="144" r="2.7" fill="#e66556" opacity="0.75" class="anim drift2"/><circle cx="870" cy="302" r="3.4" fill="#e66556" opacity="0.75" class="anim drift"/><circle cx="336" cy="312" r="2.0" fill="#e7b96a" opacity="0.75" class="anim drift2"/><circle cx="540" cy="442" r="2.7" fill="#e66556" opacity="0.75" class="anim drift"/><circle cx="670" cy="138" r="3.4" fill="#e66556" opacity="0.75" class="anim drift2"/></svg>
