l="none" stroke="#b03a2e" stroke-width="1.5" stroke-dasharray="6 8" class="anim beam-cut"/><rect x="210" y="496" width="72" height="9" rx="4" fill="#b03a2e" opacity="0.35"/><rect x="398" y="496" width="72" height="9" rx="4" fill="#b03a2e" opacity="0.35"/><text x="492" y="504" class="mono" font-size="11" fill="#b03a2e">droppable</text><rect x="210" y="566" width="260" height="9" rx="4" fill="#b85145" opacity="0.92"/><text x="492" y="574" class="mono" font-size="11" fill="#1f7a4d">necessary</text><text x="96" y="646" class="mono" font-size="10.5" fill="#72616b">reverting the dashed hunk changed no probe outcome</text><circle cx="96" cy="440" r="2.0" fill="#886d3f" opacity="0.7" class="anim drift"/><circle cx="128" cy="520" r="2.6" fill="#b85145" opacity="0.7" class="anim drift2"/><circle cx="108" cy="590" r="3.2" fill="#b85145" opacity="0.7" class="anim drift"/><circle cx="548" cy="420" r="2.0" fill="#886d3f" opacity="0.7" class="anim drift2"/><circle cx="566" cy="540" r="2.6" fill="#b85145" opacity="0.7" class="anim drift"/><circle cx="530" cy="612" r="3.2" fill="#b85145" opacity="0.7" class="anim drift2"/><text x="570" y="708" text-anchor="end" class="mono" font-size="10.5" fill="#72616b">loadbearing 0.1.0</text></svg>
