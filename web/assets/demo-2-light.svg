<rect width="760" height="300" fill="url(#d2l-glow)"/>
<text x="28" y="30" class="mono" font-size="9.5" letter-spacing="1.4" fill="#b85145">CHECK --JSON</text><text x="28" y="54" font-size="16" font-weight="700" fill="#27181c">The document a CI gate reads</text><rect x="24" y="76" width="336" height="176" rx="10" fill="#fef7f7" stroke="#f7d0cb"/><text x="42" y="104" class="mono" font-size="9.5" fill="#72616b">schema</text><text x="136" y="104" class="mono" font-size="9.5" fill="#b85145">loadbearing/report@1</text><text x="42" y="130" class="mono" font-size="9.5" fill="#72616b">scope</text><text x="136" y="130" class="mono" font-size="9.5" fill="#27181c">mapped-probes-only</text><text x="42" y="156" class="mono" font-size="9.5" fill="#72616b">baseline.ok</text><text x="136" y="156" class="mono" font-size="9.5" fill="#1f7a4d">true</text><text x="42" y="182" class="mono" font-size="9.5" fill="#72616b">clusters</text><text x="136" y="182" class="mono" font-size="9.5" fill="#27181c">6 · probes 2</text><text x="42" y="208" class="mono" font-size="9.5" fill="#72616b">per cluster</text><text x="136" y="208" class="mono" font-size="9" fill="#72616b">baselineExitCode → revertedExitCode</text><text x="42" y="232" class="mono" font-size="9.5" fill="#72616b">tail</text><text x="136" y="232" class="mono" font-size="9" fill="#72616b">last 20 lines of a failing probe</text><text x="396" y="146" font-size="34" font-weight="700" fill="#1f7a4d">3</text><text x="396" y="168" class="mono" font-size="9.5" fill="#72616b">necessary</text><text x="496" y="146" font-size="34" font-weight="700" fill="#b03a2e">2</text><text x="496" y="168" class="mono" font-size="9.5" fill="#72616b">droppable</text><text x="596" y="146" font-size="34" font-weight="700" fill="#857a80">1</text><text x="596" y="168" class="mono" font-size="9.5" fill="#72616b">unverifiable</text><text x="696" y="146" font-size="34" font-weight="700" fill="#b85145">6</text><text x="696" y="168" class="mono" font-size="9.5" fill="#72616b">total</text><text x="396" y="200" class="mono" font-size="9.5" fill="#72616b">summary</text><text x="396" y="238" font-size="10" fill="#72616b">exit 0 · the format changes, the exit code does not</text></svg>
