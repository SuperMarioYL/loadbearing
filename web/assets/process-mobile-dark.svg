<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 880" width="520" height="880" role="img" aria-labelledby="procmd-title procmd-desc" data-palette="e66556-e7b96a-f6acc0-51144c69107b">
<title id="procmd-title">How Loadbearing reaches a verdict (narrow)</title>
<desc id="procmd-desc">Five ordered stages — baseline, fork, revert, observe, badge — and the bundled fixture's six clusters: src/app.js#1 droppable (app 0 to 0), src/app.js#2 necessary (app 0 to 1), src/extra.js#1 unverifiable (no probe), src/util.js#1 and #2 necessary (core 0 to 1), src/util.js#3 droppable (core 0 to 0).</desc><style>
text { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
@media (prefers-reduced-motion: reduce) { .dash, .pulse { animation: none !important; stroke-dashoffset: 0 !important; } }
.dash { stroke-dasharray: 5 8; animation: dash 5.5s linear infinite; }
.pulse { animation: pulse 6s ease-in-out infinite; }
@keyframes dash { to { stroke-dashoffset: -52; } }
@keyframes pulse { 0%,100% { opacity: .45 } 50% { opacity: 1 } }
</style><defs>
<radialGradient id="procmd-glow" cx="50%" cy="46%" r="58%">
  <stop offset="0" stop-color="#e66556" stop-opacity="0.22"/>
  <stop offset="0.55" stop-color="#e7b96a" stop-opacity="0.06"/>
  <stop offset="1" stop-color="#0a070d" stop-opacity="0"/>
</radialGradient>
<pattern id="procmd-grid" width="40" height="40" patternUnits="userSpaceOnUse">
  <path d="M40 0H0V40" fill="none" stroke="#3a1c1d" stroke-width="1" opacity="0.5"/>
</pattern>
<marker id="procmd-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
  <path d="M0 0L10 5L0 10z" fill="#e66556"/>
</marker>
</defs>
<rect width="520" height="880" fill="#0a070d"/>
<rect width="520" height="880" fill="url(#procmd-grid)" opacity="0.45"/>
<rect width="520" height="880" fill="url(#procmd-glow)"/>
<text x="32" y="52" font-size="21" font-weight="700" fill="#fdeef2">From diff to badge</text><text x="32" y="76" font-size="10.5" fill="#b29fa8">A red baseline never produces a badge.</text><text x="32" y="93" font-size="10.5" fill="#b29fa8">Only a reversible cluster with green probes does.</text><rect x="32" y="116" width="456" height="86" rx="9" fill="#131017" stroke="#3a1c1d"/><circle cx="56" cy="142" r="12" fill="#0a070d" stroke="#e66556"/><text x="56" y="146" class="mono" font-size="9.5" text-anchor="middle" fill="#e66556">01</text><text x="78" y="146" font-size="13.5" font-weight="600" fill="#fdeef2">Baseline</text><text x="78" y="166" font-size="9.5" fill="#b29fa8">Run every probe once on pristine HEAD.</text><text x="78" y="182" font-size="9.5" fill="#b29fa8">One failure stops the run (exit 3).</text><path d="M260 202V216" stroke="#3a1c1d" stroke-width="1.2"/><rect x="32" y="216" width="456" height="86" rx="9" fill="#131017" stroke="#3a1c1d"/><circle cx="56" cy="242" r="12" fill="#0a070d" stroke="#e66556"/><text x="56" y="246" class="mono" font-size="9.5" text-anchor="middle" fill="#e66556">02</text><text x="78" y="246" font-size="13.5" font-weight="600" fill="#fdeef2">Fork</text><text x="78" y="266" font-size="9.5" fill="#b29fa8">git worktree add --detach HEAD.</text><text x="78" y="282" font-size="9.5" fill="#b29fa8">A fresh throwaway tree per cluster.</text><path d="M260 302V316" stroke="#3a1c1d" stroke-width="1.2"/><rect x="32" y="316" width="456" height="86" rx="9" fill="#131017" stroke="#3a1c1d"/><circle cx="56" cy="342" r="12" fill="#0a070d" stroke="#e66556"/><text x="56" y="346" class="mono" font-size="9.5" text-anchor="middle" fill="#e66556">03</text><text x="78" y="346" font-size="13.5" font-weight="600" fill="#fdeef2">Revert</text><text x="78" y="366" font-size="9.5" fill="#b29fa8">git apply -R the cluster's blocks.</text><text x="78" y="382" font-size="9.5" fill="#b29fa8">A failed apply merges the next hunk.</text><path d="M260 402V416" stroke="#3a1c1d" stroke-width="1.2"/><rect x="32" y="416" width="456" height="86" rx="9" fill="#131017" stroke="#3a1c1d"/><circle cx="56" cy="442" r="12" fill="#0a070d" stroke="#e66556"/><text x="56" y="446" class="mono" font-size="9.5" text-anchor="middle" fill="#e66556">04</text><text x="78" y="446" font-size="13.5" font-weight="600" fill="#fdeef2">Observe</text><text x="78" y="466" font-size="9.5" fill="#b29fa8">Only probes whose globs match run.</text><text x="78" y="482" font-size="9.5" fill="#b29fa8">No probe, no badge.</text><path d="M260 502V516" stroke="#3a1c1d" stroke-width="1.2"/><rect x="32" y="516" width="456" height="86" rx="9" fill="#131017" stroke="#3a1c1d"/><circle cx="56" cy="542" r="12" fill="#0a070d" stroke="#e66556"/><text x="56" y="546" class="mono" font-size="9.5" text-anchor="middle" fill="#e66556">05</text><text x="78" y="546" font-size="13.5" font-weight="600" fill="#fdeef2">Badge</text><text x="78" y="566" font-size="9.5" fill="#b29fa8">Compare exit codes with baseline:</text><text x="78" y="582" font-size="9.5" fill="#b29fa8">necessary · droppable · unverifiable.</text><text x="32" y="646" class="mono" font-size="8.5" letter-spacing="1.4" fill="#b29fa8">THE BUNDLED FIXTURE · 6 CLUSTERS</text><rect x="32" y="658" width="218" height="44" rx="8" fill="#131017" stroke="#3a1c1d"/><text x="44" y="675" class="mono" font-size="9.5" fill="#fdeef2">src/app.js#1</text><text x="44" y="692" class="mono" font-size="8.8" fill="#b29fa8">app 0 → 0</text><rect x="150" y="666" width="88" height="18" rx="9" fill="#2a1210" stroke="#ff7a6b" stroke-width="0.8"/><text x="194" y="678.5" class="mono" font-size="8.5" text-anchor="middle" fill="#ff7a6b">droppable</text><rect x="270" y="658" width="218" height="44" rx="8" fill="#131017" stroke="#3a1c1d"/><text x="282" y="675" class="mono" font-size="9.5" fill="#fdeef2">src/app.js#2</text><text x="282" y="692" class="mono" font-size="8.8" fill="#b29fa8">app 0 → 1</text><rect x="388" y="666" width="88" height="18" rx="9" fill="#0f2419" stroke="#63c98a" stroke-width="0.8"/><text x="432" y="678.5" class="mono" font-size="8.5" text-anchor="middle" fill="#63c98a">necessary</text><rect x="32" y="712" width="218" height="44" rx="8" fill="#131017" stroke="#3a1c1d"/><text x="44" y="729" class="mono" font-size="9.5" fill="#fdeef2">src/extra.js#1</text><text x="44" y="746" class="mono" font-size="8.8" fill="#b29fa8">no probe</text><rect x="150" y="720" width="88" height="18" rx="9" fill="#1c171c" stroke="#8d7f87" stroke-width="0.8"/><text x="194" y="732.5" class="mono" font-size="8.5" text-anchor="middle" fill="#8d7f87">unverifiable</text><rect x="270" y="712" width="218" height="44" rx="8" fill="#131017" stroke="#3a1c1d"/><text x="282" y="729" class="mono" font-size="9.5" fill="#fdeef2">src/util.js#1</text><text x="282" y="746" class="mono" font-size="8.8" fill="#b29fa8">core 0 → 1</text><rect x="388" y="720" width="88" height="18" rx="9" fill="#0f2419" stroke="#63c98a" stroke-width="0.8"/><text x="432" y="732.5" class="mono" font-size="8.5" text-anchor="middle" fill="#63c98a">necessary</text><rect x="32" y="766" width="218" height="44" rx="8" fill="#131017" stroke="#3a1c1d"/><text x="44" y="783" class="mono" font-size="9.5" fill="#fdeef2">src/util.js#2</text><text x="44" y="800" class="mono" font-size="8.8" fill="#b29fa8">core 0 → 1</text><rect x="150" y="774" width="88" height="18" rx="9" fill="#0f2419" stroke="#63c98a" stroke-width="0.8"/><text x="194" y="786.5" class="mono" font-size="8.5" text-anchor="middle" fill="#63c98a">necessary</text><rect x="270" y="766" width="218" height="44" rx="8" fill="#131017" stroke="#3a1c1d"/><text x="282" y="783" class="mono" font-size="9.5" fill="#fdeef2">src/util.js#3</text><text x="282" y="800" class="mono" font-size="8.8" fill="#b29fa8">core 0 → 0</text><rect x="388" y="774" width="88" height="18" rx="9" fill="#2a1210" stroke="#ff7a6b" stroke-width="0.8"/><text x="432" y="786.5" class="mono" font-size="8.5" text-anchor="middle" fill="#ff7a6b">droppable</text><text x="32" y="838" font-size="11" font-weight="600" fill="#fdeef2">6 clusters · 3 necessary · 2 droppable · 1 unverifiable</text><text x="32" y="858" class="mono" font-size="9" fill="#b29fa8">exit 0 report · 1 config · 2 precondition · 3 baseline failed</text></svg>
