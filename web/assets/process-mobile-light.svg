<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 880" width="520" height="880" role="img" aria-labelledby="procml-title procml-desc" data-palette="e66556-e7b96a-f6acc0-51144c69107b">
<title id="procml-title">How Loadbearing reaches a verdict (narrow)</title>
<desc id="procml-desc">Five ordered stages — baseline, fork, revert, observe, badge — and the bundled fixture's six clusters: src/app.js#1 droppable (app 0 to 0), src/app.js#2 necessary (app 0 to 1), src/extra.js#1 unverifiable (no probe), src/util.js#1 and #2 necessary (core 0 to 1), src/util.js#3 droppable (core 0 to 0).</desc><style>
text { font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif; }
.mono { font-family: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace; }
@media (prefers-reduced-motion: reduce) { .dash, .pulse { animation: none !important; stroke-dashoffset: 0 !important; } }
.dash { stroke-dasharray: 5 8; animation: dash 5.5s linear infinite; }
.pulse { animation: pulse 6s ease-in-out infinite; }
@keyframes dash { to { stroke-dashoffset: -52; } }
@keyframes pulse { 0%,100% { opacity: .45 } 50% { opacity: 1 } }
</style><defs>
<radialGradient id="procml-glow" cx="50%" cy="46%" r="58%">
  <stop offset="0" stop-color="#b85145" stop-opacity="0.1"/>
  <stop offset="0.55" stop-color="#886d3f" stop-opacity="0.035"/>
  <stop offset="1" stop-color="#fefaf9" stop-opacity="0"/>
</radialGradient>
<pattern id="procml-grid" width="40" height="40" patternUnits="userSpaceOnUse">
  <path d="M40 0H0V40" fill="none" stroke="#f7d0cb" stroke-width="1" opacity="0.7"/>
</pattern>
<marker id="procml-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
  <path d="M0 0L10 5L0 10z" fill="#b85145"/>
</marker>
</defs>
<rect width="520" height="880" fill="#fefaf9"/>
<rect width="520" height="880" fill="url(#procml-grid)" opacity="0.6"/>
<rect width="520" height="880" fill="url(#procml-glow)"/>
<text x="32" y="52" font-size="21" font-weight="700" fill="#27181c">From diff to badge</text><text x="32" y="76" font-size="10.5" fill="#72616b">A red baseline never produces a badge.</text><text x="32" y="93" font-size="10.5" fill="#72616b">Only a reversible cluster with green probes does.</text><rect x="32" y="116" width="456" height="86" rx="9" fill="#fef7f7" stroke="#f7d0cb"/><circle cx="56" cy="142" r="12" fill="#fefaf9" stroke="#b85145"/><text x="56" y="146" class="mono" font-size="9.5" text-anchor="middle" fill="#b85145">01</text><text x="78" y="146" font-size="13.5" font-weight="600" fill="#27181c">Baseline</text><text x="78" y="166" font-size="9.5" fill="#72616b">Run every probe once on pristine HEAD.</text><text x="78" y="182" font-size="9.5" fill="#72616b">One failure stops the run (exit 3).</text><path d="M260 202V216" stroke="#f7d0cb" stroke-width="1.2"/><rect x="32" y="216" width="456" height="86" rx="9" fill="#fef7f7" stroke="#f7d0cb"/><circle cx="56" cy="242" r="12" fill="#fefaf9" stroke="#b85145"/><text x="56" y="246" class="mono" font-size="9.5" text-anchor="middle" fill="#b85145">02</text><text x="78" y="246" font-size="13.5" font-weight="600" fill="#27181c">Fork</text><text x="78" y="266" font-size="9.5" fill="#72616b">git worktree add --detach HEAD.</text><text x="78" y="282" font-size="9.5" fill="#72616b">A fresh throwaway tree per cluster.</text><path d="M260 302V316" stroke="#f7d0cb" stroke-width="1.2"/><rect x="32" y="316" width="456" height="86" rx="9" fill="#fef7f7" stroke="#f7d0cb"/><circle cx="56" cy="342" r="12" fill="#fefaf9" stroke="#b85145"/><text x="56" y="346" class="mono" font-size="9.5" text-anchor="middle" fill="#b85145">03</text><text x="78" y="346" font-size="13.5" font-weight="600" fill="#27181c">Revert</text><text x="78" y="366" font-size="9.5" fill="#72616b">git apply -R the cluster's blocks.</text><text x="78" y="382" font-size="9.5" fill="#72616b">A failed apply merges the next hunk.</text><path d="M260 402V416" stroke="#f7d0cb" stroke-width="1.2"/><rect x="32" y="416" width="456" height="86" rx="9" fill="#fef7f7" stroke="#f7d0cb"/><circle cx="56" cy="442" r="12" fill="#fefaf9" stroke="#b85145"/><text x="56" y="446" class="mono" font-size="9.5" text-anchor="middle" fill="#b85145">04</text><text x="78" y="446" font-size="13.5" font-weight="600" fill="#27181c">Observe</text><text x="78" y="466" font-size="9.5" fill="#72616b">Only probes whose globs match run.</text><text x="78" y="482" font-size="9.5" fill="#72616b">No probe, no badge.</text><path d="M260 502V516" stroke="#f7d0cb" stroke-width="1.2"/><rect x="32" y="516" width="456" height="86" rx="9" fill="#fef7f7" stroke="#f7d0cb"/><circle cx="56" cy="542" r="12" fill="#fefaf9" stroke="#b85145"/><text x="56" y="546" class="mono" font-size="9.5" text-anchor="middle" fill="#b85145">05</text><text x="78" y="546" font-size="13.5" font-weight="600" fill="#27181c">Badge</text><text x="78" y="566" font-size="9.5" fill="#72616b">Compare exit codes with baseline:</text><text x="78" y="582" font-size="9.5" fill="#72616b">necessary · droppable · unverifiable.</text><text x="32" y="646" class="mono" font-size="8.5" letter-spacing="1.4" fill="#72616b">THE BUNDLED FIXTURE · 6 CLUSTERS</text><rect x="32" y="658" width="218" height="44" rx="8" fill="#fef7f7" stroke="#f7d0cb"/><text x="44" y="675" class="mono" font-size="9.5" fill="#27181c">src/app.js#1</text><text x="44" y="692" class="mono" font-size="8.8" fill="#72616b">app 0 → 0</text><rect x="150" y="666" width="88" height="18" rx="9" fill="#fbeae7" stroke="#b03a2e" stroke-width="0.8"/><text x="194" y="678.5" class="mono" font-size="8.5" text-anchor="middle" fill="#b03a2e">droppable</text><rect x="270" y="658" width="218" height="44" rx="8" fill="#fef7f7" stroke="#f7d0cb"/><text x="282" y="675" class="mono" font-size="9.5" fill="#27181c">src/app.js#2</text><text x="282" y="692" class="mono" font-size="8.8" fill="#72616b">app 0 → 1</text><rect x="388" y="666" width="88" height="18" rx="9" fill="#eaf6ee" stroke="#1f7a4d" stroke-width="0.8"/><text x="432" y="678.5" class="mono" font-size="8.5" text-anchor="middle" fill="#1f7a4d">necessary</text><rect x="32" y="712" width="218" height="44" rx="8" fill="#fef7f7" stroke="#f7d0cb"/><text x="44" y="729" class="mono" font-size="9.5" fill="#27181c">src/extra.js#1</text><text x="44" y="746" class="mono" font-size="8.8" fill="#72616b">no probe</text><rect x="150" y="720" width="88" height="18" rx="9" fill="#f1edef" stroke="#857a80" stroke-width="0.8"/><text x="194" y="732.5" class="mono" font-size="8.5" text-anchor="middle" fill="#857a80">unverifiable</text><rect x="270" y="712" width="218" height="44" rx="8" fill="#fef7f7" stroke="#f7d0cb"/><text x="282" y="729" class="mono" font-size="9.5" fill="#27181c">src/util.js#1</text><text x="282" y="746" class="mono" font-size="8.8" fill="#72616b">core 0 → 1</text><rect x="388" y="720" width="88" height="18" rx="9" fill="#eaf6ee" stroke="#1f7a4d" stroke-width="0.8"/><text x="432" y="732.5" class="mono" font-size="8.5" text-anchor="middle" fill="#1f7a4d">necessary</text><rect x="32" y="766" width="218" height="44" rx="8" fill="#fef7f7" stroke="#f7d0cb"/><text x="44" y="783" class="mono" font-size="9.5" fill="#27181c">src/util.js#2</text><text x="44" y="800" class="mono" font-size="8.8" fill="#72616b">core 0 → 1</text><rect x="150" y="774" width="88" height="18" rx="9" fill="#eaf6ee" stroke="#1f7a4d" stroke-width="0.8"/><text x="194" y="786.5" class="mono" font-size="8.5" text-anchor="middle" fill="#1f7a4d">necessary</text><rect x="270" y="766" width="218" height="44" rx="8" fill="#fef7f7" stroke="#f7d0cb"/><text x="282" y="783" class="mono" font-size="9.5" fill="#27181c">src/util.js#3</text><text x="282" y="800" class="mono" font-size="8.8" fill="#72616b">core 0 → 0</text><rect x="388" y="774" width="88" height="18" rx="9" fill="#fbeae7" stroke="#b03a2e" stroke-width="0.8"/><text x="432" y="786.5" class="mono" font-size="8.5" text-anchor="middle" fill="#b03a2e">droppable</text><text x="32" y="838" font-size="11" font-weight="600" fill="#27181c">6 clusters · 3 necessary · 2 droppable · 1 unverifiable</text><text x="32" y="858" class="mono" font-size="9" fill="#72616b">exit 0 report · 1 config · 2 precondition · 3 baseline failed</text></svg>
