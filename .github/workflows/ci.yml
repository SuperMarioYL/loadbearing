name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check VERSION matches package.json
        run: |
          package_version="$(node -p "require('./package.json').version")"
          file_version="$(tr -d '[:space:]' < VERSION)"
          test "$package_version" = "$file_version" || {
            echo "package.json version $package_version does not match VERSION $file_version" >&2
            exit 1
          }
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
